<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor CM - 1015 & 1510</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 60vh; width: 100%; border-radius: 12px; }
        .bus-marker { font-weight: bold; padding: 2px 5px; border-radius: 4px; border: 1px solid black; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <header class="mb-4 text-center">
        <h1 class="text-xl font-bold text-blue-900">Carris Metropolitana em Tempo Real</h1>
    </header>

    <!-- Mapa -->
    <div id="map" class="shadow-lg mb-4"></div>

    <!-- Painel de Horários (Interface Mobile) -->
    <div class="grid grid-cols-1 gap-3">
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-400">
            <h2 class="font-bold text-lg">1015 | Circular</h2>
            <p class="text-sm text-gray-600">Próximas passagens na Reboleira: <span id="eta-1015">A carregar...</span></p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-pink-600">
            <h2 class="font-bold text-lg">1510 | Amadora - Damaia</h2>
            <p class="text-sm text-gray-600">Sentido Pavilhão: <span id="eta-1510-up">-- min</span></p>
            <p class="text-sm text-gray-600">Sentido Hospital: <span id="eta-1510-down">-- min</span></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicialização do Mapa
        const map = L.map('map').setView([38.748, -9.192], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Ícones para os pontos fixos
        const homeIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/25/25694.png', iconSize: [25, 25] });

        // Marcadores Fixos
        L.marker([38.74697, -9.22853], {icon: homeIcon}).addTo(map).bindPopup("Casa"); // Conversão DMS para Decimal
        L.marker([38.748177, -9.192485]).addTo(map).bindPopup("Escola");
        L.marker([38.750335, -9.221748]).addTo(map).bindPopup("Reboleira (Estação)");

        // Função para simular/carregar posição dos autocarros da API
        async function updateBuses() {
            // Aqui faria o fetch para: https://api.carrismetropolitana.pt/vehicles
            // E filtraria pelos ids 1015 e 1510
            console.log("A atualizar posições via JSON...");
        }

        setInterval(updateBuses, 10000); // Atualiza a cada 10 segundos
    </script>
</body>
</html>
